<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>귀여운 별이의 돈 먹기 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-card {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        /* 캔버스 스타일 */
        canvas {
            border-radius: 1.5rem;
            background: linear-gradient(to bottom, #e0f2fe, #fef3c7);
        }

        .diff-btn {
            transition: all 0.2s ease;
        }
        .diff-btn.selected {
            transform: scale(1.05);
            ring: 4px;
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 text-slate-800">

    <!-- 메인 게임 컨테이너 -->
    <div class="game-card bg-white p-4 sm:p-6 rounded-3xl max-w-lg w-full flex flex-col items-center border-4 border-amber-300 relative overflow-hidden">
        
        <!-- 헤더 및 점수판 -->
        <div class="w-full flex justify-between items-center mb-4 px-2">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-amber-500 flex items-center gap-2">
                    ⭐ 별이의 돈 모으기!
                </h1>
                <div class="flex items-center gap-2 mt-1">
                    <span id="levelBadge" class="bg-emerald-500 text-white text-xs px-2.5 py-0.5 rounded-full font-bold">🌱 쉬움</span>
                    <span id="speedBadge" class="text-xs text-amber-700 bg-amber-100 px-2.5 py-0.5 rounded-full font-bold">속도: 1.0x</span>
                </div>
            </div>
            <div class="bg-amber-100 border-2 border-amber-300 rounded-2xl px-4 py-2 text-right">
                <span class="text-xs text-amber-700 block">획득한 돈</span>
                <span id="score" class="text-xl sm:text-2xl font-black text-amber-600">0 원</span>
                <div class="w-24 bg-slate-200 h-2 rounded-full mt-1 overflow-hidden">
                    <div id="goalBar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 게임 캔버스 영역 -->
        <div class="relative w-full aspect-[4/3] max-h-[400px]">
            <canvas id="gameCanvas" class="w-full h-full block shadow-inner"></canvas>
            
            <!-- 게임 커버 / 표지 / 난이도 선택 / 결과 오버레이 -->
            <div id="overlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-md rounded-3xl flex flex-col items-center justify-center p-6 text-white text-center z-10 transition-all">
                
                <!-- 캐릭터 헤더 로고 -->
                <div id="overlayIcon" class="text-5xl mb-1 animate-bounce">⭐</div>
                <h2 id="overlayTitle" class="text-3xl font-extrabold text-amber-300 mb-1">별이의 돈 먹기 게임</h2>
                <p id="overlaySub" class="text-xs sm:text-sm mb-4 text-amber-100">
                    떨어지는 돈을 모아 <b>50,000원</b>을 달성하세요!<br>
                    💣폭탄(-1만원)과 ⚡번개(-1.5만원+마비)를 조심하세요!
                </p>

                <!-- 난이도 선택 버튼 그룹 -->
                <div id="diffSelector" class="w-full max-w-xs mb-5">
                    <span class="text-xs text-slate-300 mb-2 block font-bold">난이도를 선택하세요</span>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="selectDifficulty('easy')" id="btn-easy" class="diff-btn selected bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-xl font-bold text-sm shadow border-2 border-emerald-300">
                            🌱 쉬움
                        </button>
                        <button onclick="selectDifficulty('normal')" id="btn-normal" class="diff-btn bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-xl font-bold text-sm shadow border-2 border-amber-300">
                            ⚡ 보통
                        </button>
                        <button onclick="selectDifficulty('hard')" id="btn-hard" class="diff-btn bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl font-bold text-sm shadow border-2 border-red-300">
                            🔥 매움
                        </button>
                    </div>
                </div>

                <!-- 게임 시작 버튼 -->
                <button id="startBtn" onclick="startGame()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold text-lg sm:text-xl px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105 active:scale-95 border-2 border-amber-200">
                    게임 시작하기 🚀
                </button>
            </div>
        </div>

        <!-- 모바일 / 터치용 컨트롤 버튼 -->
        <div class="mt-4 w-full grid grid-cols-3 gap-2 max-w-[280px] sm:hidden">
            <div></div>
            <button class="bg-amber-200 active:bg-amber-300 text-amber-900 py-3 rounded-2xl font-bold text-xl shadow" ontouchstart="setKey('Up', true)" ontouchend="setKey('Up', false)">▲</button>
            <div></div>
            <button class="bg-amber-200 active:bg-amber-300 text-amber-900 py-3 rounded-2xl font-bold text-xl shadow" ontouchstart="setKey('Left', true)" ontouchend="setKey('Left', false)">◀</button>
            <button class="bg-amber-200 active:bg-amber-300 text-amber-900 py-3 rounded-2xl font-bold text-xl shadow" ontouchstart="setKey('Down', true)" ontouchend="setKey('Down', false)">▼</button>
            <button class="bg-amber-200 active:bg-amber-300 text-amber-900 py-3 rounded-2xl font-bold text-xl shadow" ontouchstart="setKey('Right', true)" ontouchend="setKey('Right', false)">▶</button>
        </div>

        <!-- 조작 안내 문구 -->
        <div class="mt-3 text-xs text-slate-400 text-center font-sans">
            ⌨️ 키보드 조작: 방향키(↑, ↓, ←, →) 또는 W, A, S, D
        </div>
    </div>

    <script>
        // --- 캔버스 및 오디오 설정 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const goalBar = document.getElementById('goalBar');
        const levelBadge = document.getElementById('levelBadge');
        const speedBadge = document.getElementById('speedBadge');
        
        const overlay = document.getElementById('overlay');
        const overlayIcon = document.getElementById('overlayIcon');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const diffSelector = document.getElementById('diffSelector');
        const startBtn = document.getElementById('startBtn');

        // 난이도 설정 객체
        let selectedDiff = 'easy';
        const DIFFICULTY_SETTINGS = {
            easy: {
                name: '🌱 쉬움',
                colorClass: 'bg-emerald-500',
                baseSpeedMult: 0.85,
                spawnRate: 32,
                goodWeights: [0.55, 0.30, 0.15], // 1k, 5k, 10k
                badWeights: [0.10, 0.05, 0.02]   // thief, bomb, thunder
            },
            normal: {
                name: '⚡ 보통',
                colorClass: 'bg-amber-500',
                baseSpeedMult: 1.1,
                spawnRate: 26,
                goodWeights: [0.45, 0.25, 0.10],
                badWeights: [0.15, 0.10, 0.05]
            },
            hard: {
                name: '🔥 매움',
                colorClass: 'bg-red-500',
                baseSpeedMult: 1.45,
                spawnRate: 20,
                goodWeights: [0.30, 0.15, 0.08],
                badWeights: [0.22, 0.15, 0.10]
            }
        };

        // 난이도 선택 함수
        function selectDifficulty(diff) {
            selectedDiff = diff;
            ['easy', 'normal', 'hard'].forEach(d => {
                const btn = document.getElementById(`btn-${d}`);
                if (d === diff) {
                    btn.classList.add('selected', 'ring-4', 'ring-white');
                } else {
                    btn.classList.remove('selected', 'ring-4', 'ring-white');
                }
            });
        }

        // Web Audio API 효과음
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'bad') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'stun') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783, audioCtx.currentTime + 0.2);
                osc.frequency.setValueAtTime(1046, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // 해상도 반응형 조절
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 게임 변수 ---
        let gameRunning = false;
        let score = 0;
        const TARGET_SCORE = 50000;
        let startTime = 0;
        let animationFrameId;

        const keys = { Left: false, Right: false, Up: false, Down: false };

        // --- 별 캐릭터 객체 ---
        const player = {
            x: 0,
            y: 0,
            size: 40,
            baseSpeed: 5.5,
            stunnedUntil: 0,
            
            init() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 70;
                this.stunnedUntil = 0;
            },

            isStunned() {
                return Date.now() < this.stunnedUntil;
            },

            stun(durationMs) {
                this.stunnedUntil = Date.now() + durationMs;
            },

            update() {
                const currentSpeed = this.isStunned() ? this.baseSpeed * 0.25 : this.baseSpeed;

                if (keys.Left && this.x - this.size > 0) this.x -= currentSpeed;
                if (keys.Right && this.x + this.size < canvas.width) this.x += currentSpeed;
                if (keys.Up && this.y - this.size > 0) this.y -= currentSpeed;
                if (keys.Down && this.y + this.size < canvas.height) this.y += currentSpeed;
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // 마비 시 진동 효과
                if (this.isStunned()) {
                    ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
                }

                // 1. 별 모양 외곽선 및 채우기
                ctx.beginPath();
                const points = 5;
                const outerRadius = this.size;
                const innerRadius = this.size * 0.55;

                for (let i = 0; i < points * 2; i++) {
                    const radius = (i % 2 === 0) ? outerRadius : innerRadius;
                    const angle = (i * Math.PI) / points - Math.PI / 2;
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;

                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();

                // 마비 색상 변화
                ctx.fillStyle = this.isStunned() ? "#C084FC" : "#FDE047";
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#292524";
                ctx.lineJoin = "round";
                ctx.stroke();

                // 2. 캐릭터 얼굴 (눈 & 입)
                ctx.fillStyle = "#1c1917";
                if (this.isStunned()) {
                    ctx.font = "bold 15px sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("✖", -10, -8);
                    ctx.fillText("✖", 10, -8);
                } else {
                    ctx.beginPath();
                    ctx.ellipse(-12, -10, 7.5, 11, -0.1, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.ellipse(12, -10, 7.5, 11, 0.1, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 볼 점 입
                ctx.beginPath();
                ctx.arc(-9, 8, 2.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(9, 8, 2.2, 0, Math.PI * 2);
                ctx.fill();

                // 마비 이모지 표시
                if (this.isStunned()) {
                    ctx.font = "20px sans-serif";
                    ctx.fillText("⚡", 0, -this.size - 6);
                }

                ctx.restore();
            }
        };

        // --- 아이템 시스템 ---
        let coins = [];
        let particles = [];

        function getSpeedMultiplier() {
            const setting = DIFFICULTY_SETTINGS[selectedDiff];
            return setting.baseSpeedMult + (score / TARGET_SCORE) * 0.8;
        }

        function spawnCoin() {
            const speedMult = getSpeedMultiplier();
            const setting = DIFFICULTY_SETTINGS[selectedDiff];

            const types = [
                { value: 1000, color: '#10B981', size: 18, label: '1,000원', speed: (3 + Math.random() * 1.5) * speedMult, isPenalty: false },
                { value: 5000, color: '#F59E0B', size: 22, label: '5,000원', speed: (3.5 + Math.random() * 1.5) * speedMult, isPenalty: false },
                { value: 10000, color: '#3B82F6', size: 25, label: '10,000원', speed: (4 + Math.random() * 2) * speedMult, isPenalty: false },
                { value: -3000, color: '#EF4444', size: 20, label: '-3,000원', speed: (4.2 + Math.random() * 2) * speedMult, isPenalty: true, type: 'thief' },
                { value: -10000, color: '#1E293B', size: 24, label: '-10,000원', speed: (4.8 + Math.random() * 2.2) * speedMult, isPenalty: true, type: 'bomb' },
                { value: -15000, color: '#9333EA', size: 23, label: '-15,000원 ⚡마비!', speed: (5.2 + Math.random() * 2.5) * speedMult, isPenalty: true, type: 'thunder', stun: 1500 }
            ];

            const rand = Math.random();
            let selectedType;

            const g = setting.goodWeights;
            const b = setting.badWeights;

            if (rand < g[0]) selectedType = types[0];
            else if (rand < g[0] + g[1]) selectedType = types[1];
            else if (rand < g[0] + g[1] + g[2]) selectedType = types[2];
            else if (rand < g[0] + g[1] + g[2] + b[0]) selectedType = types[3];
            else if (rand < g[0] + g[1] + g[2] + b[0] + b[1]) selectedType = types[4];
            else selectedType = types[5];

            coins.push({
                x: Math.random() * (canvas.width - 50) + 25,
                y: -25,
                ...selectedType
            });
        }

        function drawCoins() {
            coins.forEach((coin, index) => {
                coin.y += coin.speed;

                ctx.save();
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.size, 0, Math.PI * 2);
                ctx.fillStyle = coin.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = coin.isPenalty ? '#581c87' : '#065f46';
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 13px Jua, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (coin.type === 'bomb') ctx.fillText('💣', coin.x, coin.y);
                else if (coin.type === 'thunder') ctx.fillText('⚡', coin.x, coin.y);
                else if (coin.type === 'thief') ctx.fillText('💸', coin.x, coin.y);
                else ctx.fillText('₩', coin.x, coin.y + 1);

                ctx.restore();

                if (coin.y - coin.size > canvas.height) {
                    coins.splice(index, 1);
                }
            });
        }

        // --- 이펙트 생성 ---
        function createEffect(x, y, text, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7,
                    life: 1.0,
                    color: color
                });
            }

            particles.push({
                x: x,
                y: y,
                vx: 0,
                vy: -1.5,
                text: text.startsWith('-') ? text : '+' + text,
                life: 1.2,
                isText: true,
                color: color
            });
        }

        function updateParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);

                if (p.isText) {
                    ctx.fillStyle = p.color;
                    ctx.font = 'bold 18px Jua, sans-serif';
                    ctx.fillText(p.text, p.x, p.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }
                ctx.restore();

                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });
        }

        // --- 충돌 감지 ---
        function checkCollisions() {
            coins.forEach((coin, index) => {
                const dist = Math.hypot(player.x - coin.x, player.y - coin.y);
                if (dist < player.size + coin.size) {
                    score = Math.max(0, score + coin.value);
                    scoreEl.innerText = score.toLocaleString() + ' 원';
                    
                    const percent = Math.min(100, (score / TARGET_SCORE) * 100);
                    goalBar.style.width = percent + '%';
                    speedBadge.innerText = `속도: ${getSpeedMultiplier().toFixed(1)}x`;

                    if (coin.type === 'thunder') {
                        playSound('stun');
                        player.stun(coin.stun);
                        createEffect(coin.x, coin.y, coin.label, '#A855F7');
                    } else if (coin.isPenalty) {
                        playSound('bad');
                        createEffect(coin.x, coin.y, coin.label, '#EF4444');
                    } else {
                        playSound('coin');
                        createEffect(coin.x, coin.y, coin.label, coin.color);
                    }

                    coins.splice(index, 1);

                    if (score >= TARGET_SCORE) {
                        endGame(true);
                    }
                }
            });
        }

        // --- 게임 종료 ---
        function endGame(isWin) {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);

            const timeTaken = ((Date.now() - startTime) / 1000).toFixed(1);

            if (isWin) {
                playSound('win');
                overlayIcon.innerText = '🏆⭐';
                overlayTitle.innerText = '축하합니다! 미션 성공!';
                overlaySub.innerHTML = `[${DIFFICULTY_SETTINGS[selectedDiff].name}] 난이도를 <b>${timeTaken}초</b> 만에 클리어했습니다!`;
                
                diffSelector.classList.remove('hidden');
                startBtn.innerText = '다시 도전하기 🔄';
                overlay.classList.remove('hidden');
            }
        }

        // --- 키보드 및 이벤트 조작 ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = false;
        });

        function setKey(dir, active) {
            keys[dir] = active;
        }

        let spawnTimer = 0;

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            spawnTimer++;
            const setting = DIFFICULTY_SETTINGS[selectedDiff];
            const spawnInterval = Math.max(12, setting.spawnRate - Math.floor((score / TARGET_SCORE) * 10));
            
            if (spawnTimer % spawnInterval === 0) {
                spawnCoin();
            }

            player.update();
            player.draw();
            drawCoins();
            checkCollisions();
            updateParticles();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            resizeCanvas();
            score = 0;
            startTime = Date.now();
            scoreEl.innerText = '0 원';
            goalBar.style.width = '0%';
            
            const setting = DIFFICULTY_SETTINGS[selectedDiff];
            levelBadge.innerText = setting.name;
            levelBadge.className = `text-white text-xs px-2.5 py-0.5 rounded-full font-bold ${setting.colorClass}`;
            speedBadge.innerText = `속도: ${setting.baseSpeedMult.toFixed(1)}x`;

            coins = [];
            particles = [];
            player.init();
            
            overlay.classList.add('hidden');
            gameRunning = true;
            
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }
    </script>
</body>
</html>
